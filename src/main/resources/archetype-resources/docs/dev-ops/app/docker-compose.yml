#set( $dollar = '$' )
#set( $hash = '#' )
${hash} 应用部署：与 environment/docker-compose.yml 合并使用，构建上下文为发布包根目录。
${hash} 发布脚本会提供 RELEASE_ID；不要单独运行本文件或叠加 environment/docker-compose.dev.yml。
name: ${artifactId}

x-logging: &logging
  driver: local
  options:
    max-size: 20m
    max-file: "5"

services:
  app:
    image: ${artifactId}/app:${dollar}{APP_RELEASE_ID:-${dollar}{RELEASE_ID:?Use deploy-server.sh}}
    build:
      context: ..
      dockerfile: app/Dockerfile
      args:
        JAR_FILE: app.jar
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      APP_DB_URL: jdbc:mysql://mysql:3306/${databaseName}?characterEncoding=UTF-8&connectionTimeZone=UTC
      APP_DB_USERNAME: ${databaseName}
      APP_DB_PASSWORD: ${dollar}{MYSQL_PASSWORD:?Configure MYSQL_PASSWORD}
      LOG_PATH: /tmp/logs
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
      TZ: Asia/Shanghai
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      mysql:
        condition: service_healthy
    networks: [database, middleware, frontend]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging: *logging

  nginx:
    image: ${artifactId}/web:${dollar}{WEB_RELEASE_ID:-${dollar}{RELEASE_ID:?Use deploy-server.sh}}
    build:
      context: ..
      dockerfile: environment/nginx/Dockerfile
    volumes:
      - type: bind
        source: ${dollar}{WEB_ROOT:?Configure WEB_ROOT}
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    ports:
      - "${dollar}{HTTP_BIND:-0.0.0.0}:${dollar}{HTTP_PORT:-${httpPort}}:80"
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

networks:
  frontend: {}
