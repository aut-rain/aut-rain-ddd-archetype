#set( $dollar = '$' )
#set( $hash = '#' )
spring:
  application:
    name: ${artifactId}
  profiles:
    default: dev
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  file:
    path: ${dollar}{LOG_PATH:./logs}
