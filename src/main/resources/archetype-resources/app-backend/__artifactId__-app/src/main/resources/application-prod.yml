#set( $dollar = '$' )
#set( $hash = '#' )
server:
  port: ${dollar}{SERVER_PORT:8080}
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${dollar}{APP_DB_URL}
    username: ${dollar}{APP_DB_USERNAME}
    password: ${dollar}{APP_DB_PASSWORD}
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration
